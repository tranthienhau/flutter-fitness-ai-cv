name: flutter_fitness_ai_cv
description: AI-powered fitness coaching with computer vision physique analysis
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  camera: ^0.11.0+1
  google_mlkit_pose_detection: ^0.11.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.3.3
  image: ^4.1.7
  permission_handler: ^11.3.0
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
